# Resource limits for the decision layer. Fixed before optimisation.
H_hours: 3.0          # analysis period in hours; added bus-hours = vehicle delta x H
B_h_bus_hours: 30.0   # maximum added bus-hours one package may use
B_h_max: 120.0        # largest B_h the API and UI offer (budget slider maximum); the default above is the decision limit
K_new_infra_km: 2.0   # maximum km of new walk/bike links that require construction
N_a_actions: 3        # maximum number of selected actions (catalog entries) in one package
N_a_max: 5            # largest N_a the API and UI offer; precompute enumerates every package up to it
max_exact_packages: 3000  # above this many enumerated packages, exact search is skipped and the best baseline is returned as approximate
